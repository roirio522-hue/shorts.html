<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Editor - Audio & Smart Zoom</title>
    <style>
        :root { --primary: #00f2fe; --bg: #0b0e14; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; text-align: center; }
        .app-card { max-width: 480px; margin: auto; background: #161b22; padding: 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #30363d; }
        h2 { color: var(--primary); margin-bottom: 20px; font-weight: 600; }
        .input-box { text-align: left; margin-bottom: 15px; }
        label { font-size: 13px; color: #8b949e; margin-bottom: 5px; display: block; }
        input, select, button { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 15px; outline: none; box-sizing: border-box; }
        button { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: #000; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #30363d; color: #8b949e; }
        .progress-area { display: none; margin: 20px 0; }
        .track { height: 8px; background: #30363d; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--primary); transition: 0.1s linear; }
        .output-grid { margin-top: 30px; display: grid; gap: 20px; }
        .clip-box { background: #21262d; padding: 15px; border-radius: 18px; border: 1px solid #30363d; }
        video { width: 100%; border-radius: 10px; }
        .download-link { background: #238636; color: white; text-decoration: none; padding: 12px; border-radius: 10px; display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>🎬 Sound & Smart Zoom Editor</h2>
    
    <div class="input-box">
        <label>ভিডিও ফাইল আপলোড করুন</label>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-box" style="flex: 1.5;">
            <label>মোড সিলেক্ট করুন</label>
            <select id="videoMode">
                <option value="shorts">YouTube Shorts (9:16)</option>
                <option value="long">Long Video (16:9)</option>
            </select>
        </div>
        <div class="input-box" style="flex: 1;">
            <label>ক্লিপ সংখ্যা</label>
            <input type="number" id="clipCount" value="3" min="1" max="10">
        </div>
    </div>

    <div class="input-box">
        <label>ক্লিপের দৈর্ঘ্য</label>
        <select id="clipDuration">
            <option value="15">১৫ সেকেন্ড</option>
            <option value="30">৩০ সেকেন্ড</option>
            <option value="60">১ মিনিট</option>
        </select>
    </div>

    <button id="startBtn">সাউন্ডসহ এডিট শুরু করুন</button>

    <div class="progress-area" id="progressArea">
        <div class="track"><div class="bar-fill" id="barFill"></div></div>
        <div id="status" style="font-size: 14px; margin-top: 10px;">প্রসেস হচ্ছে...</div>
    </div>

    <canvas id="exportCanvas" style="display:none;"></canvas>
    <video id="hiddenVideo" style="display:none;" playsinline></video>
    <div class="output-grid" id="outputGrid"></div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const startBtn = document.getElementById('startBtn');
    const barFill = document.getElementById('barFill');
    const progressArea = document.getElementById('progressArea');
    const status = document.getElementById('status');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const outputGrid = document.getElementById('outputGrid');

    startBtn.onclick = async () => {
        const file = videoInput.files[0];
        if (!file) return alert("ফাইল দিন!");

        const durationSec = parseInt(document.getElementById('clipDuration').value);
        const count = parseInt(document.getElementById('clipCount').value);
        const mode = document.getElementById('videoMode').value;
        
        if (mode === 'shorts') {
            canvas.width = 720; canvas.height = 1280;
        } else {
            canvas.width = 1280; canvas.height = 720;
        }

        startBtn.disabled = true;
        progressArea.style.display = 'block';
        outputGrid.innerHTML = '';
        hiddenVideo.src = URL.createObjectURL(file);

        await new Promise(r => hiddenVideo.onloadedmetadata = r);
        const totalTime = hiddenVideo.duration;

        for (let i = 0; i < count; i++) {
            const startTime = Math.random() * (totalTime - durationSec);
            hiddenVideo.currentTime = startTime;
            await new Promise(r => hiddenVideo.onseeked = r);
            
            status.innerText = `ক্লিপ ${i + 1}/${count} সাউন্ডসহ রেকর্ড হচ্ছে...`;
            barFill.style.width = "0%";

            // অডিও এবং ভিডিও ট্র্যাক একসাথে ধরা
            const videoStream = canvas.captureStream(60);
            const audioContext = new AudioContext();
            const source = audioContext.createMediaElementSource(hiddenVideo);
            const destination = audioContext.createMediaStreamDestination();
            source.connect(destination);
            source.connect(audioContext.destination); // স্পিকারে সাউন্ড শোনার জন্য

            const combinedStream = new MediaStream([
                ...videoStream.getVideoTracks(),
                ...destination.stream.getAudioTracks()
            ]);

            const recorder = new MediaRecorder(combinedStream, { 
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 12000000 // বিটরেট বাড়ানো হয়েছে কোয়ালিটির জন্য
            });
            
            const chunks = [];
            const recordPromise = new Promise(resolve => {
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
            });

            recorder.start();
            await hiddenVideo.play();

            const renderFrame = () => {
                if (!hiddenVideo.paused && !hiddenVideo.ended) {
                    const vW = hiddenVideo.videoWidth;
                    const vH = hiddenVideo.videoHeight;
                    
                    if (mode === 'shorts') {
                        // স্মার্ট জুম (বেশি জুম আউট করা হয়েছে যাতে ছবি না ফাটে)
                        const zoomFactor = 0.8; // ০.৮ মানে একটু জুম আউট
                        const sw = (vH * (9/16)) / zoomFactor;
                        const sh = vH / zoomFactor;
                        const sx = (vW - sw) / 2;
                        const sy = (vH - sh) / 2;
                        ctx.drawImage(hiddenVideo, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.drawImage(hiddenVideo, 0, 0, vW, vH, 0, 0, canvas.width, canvas.height);
                    }
                    
                    const progress = (hiddenVideo.currentTime - startTime) / durationSec;
                    barFill.style.width = Math.min(progress * 100, 100) + "%";
                    requestAnimationFrame(renderFrame);
                }
            };
            renderFrame();

            await new Promise(r => setTimeout(r, durationSec * 1000));
            
            hiddenVideo.pause();
            recorder.stop();
            const blob = await recordPromise;
            
            const url = URL.createObjectURL(blob);
            const div = document.createElement('div');
            div.className = 'clip-box';
            div.innerHTML = `
                <video src="${url}" controls></video>
                <a href="${url}" download="Edit_${i+1}.webm" class="download-link">⬇️ ডাউনলোড ক্লিপ ${i+1}</a>
            `;
            outputGrid.appendChild(div);
        }
        
        status.innerText = "✅ সাউন্ডসহ এডিটিং শেষ!";
        startBtn.disabled = false;
    };
</script>

</body>
</html>
