<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Maker Mobile Fix</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 15px; text-align: center; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; max-width: 400px; margin: auto; }
        input, select, button { width: 100%; margin: 10px 0; padding: 12px; border-radius: 10px; border: none; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #444; color: #888; }
        #status-box { background: #000; padding: 10px; border-radius: 8px; font-size: 13px; color: #0f0; margin-top: 15px; min-height: 50px; text-align: left; border: 1px solid #222; }
        video { width: 100%; border-radius: 10px; margin-top: 20px; border: 1px solid #444; }
        .dl-link { display: block; background: #28a745; color: white; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h3>🎬 Shorts Maker Pro</h3>
    <p style="font-size: 12px; color: #888;">ফোনে ব্যবহারের জন্য বিশেষ ভার্সন</p>
    
    <input type="file" id="video-file" accept="video/*">
    
    <div style="display: flex; gap: 10px;">
        <select id="duration">
            <option value="5">৫ সেকেন্ড</option>
            <option value="10">১০ সেকেন্ড</option>
        </select>
        <input type="number" id="count" value="1" min="1" max="3" style="width: 60px; padding: 10px;">
    </div>

    <button id="run-btn">ম্যাজিক এডিট শুরু করুন</button>
    
    <div id="status-box">স্ট্যাটাস: রেডি...</div>
    <div id="result"></div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    // এখানে corePath নির্দিষ্ট করে দেওয়া হয়েছে যা সিঙ্গেল থ্রেড মোডে চলে
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js' 
    });

    const status = document.getElementById('status-box');
    const updateStatus = (msg) => { status.innerText = `> ${msg}`; };

    document.getElementById('run-btn').onclick = async () => {
        const file = document.getElementById('video-file').files[0];
        if (!file) return alert("ভিডিও ফাইলটি সিলেক্ট করো!");

        const dur = parseInt(document.getElementById('duration').value);
        const qty = parseInt(document.getElementById('count').value);
        const btn = document.getElementById('run-btn');

        btn.disabled = true;
        updateStatus("ইঞ্জিন লোড হচ্ছে (একটু সময় লাগবে)...");

        try {
            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            updateStatus("ফাইল রিড করা হচ্ছে...");
            ffmpeg.FS('writeFile', 'input_vid.mp4', await fetchFile(file));

            // ভিডিওর মোট দৈর্ঘ্য জানতে একটি অদৃশ্য ভিডিও এলিমেন্ট
            const tempVid = document.createElement('video');
            tempVid.src = URL.createObjectURL(file);
            
            tempVid.onloadedmetadata = async () => {
                const totalDur = tempVid.duration;
                document.getElementById('result').innerHTML = '';

                for (let i = 0; i < qty; i++) {
                    const startPos = Math.floor(Math.random() * (totalDur - dur));
                    const outFileName = `short_video_${i + 1}.mp4`;

                    updateStatus(`ক্লিপ ${i + 1}/${qty} তৈরি হচ্ছে... ধৈর্য ধরুন।`);

                    // ফোনের জন্য সবথেকে লাইট কমান্ড
                    await ffmpeg.run(
                        '-ss', `${startPos}`,
                        '-i', 'input_vid.mp4',
                        '-t', `${dur}`,
                        '-vf', 'crop=ih*9/16:ih,scale=360:640', // ফোনের জন্য ৩৬০পি রেজোলিউশন (ফাস্ট হবে)
                        '-c:v', 'libx264',
                        '-preset', 'ultrafast',
                        outFileName
                    );

                    const data = ffmpeg.FS('readFile', outFileName);
                    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

                    const div = document.createElement('div');
                    div.innerHTML = `
                        <video src="${url}" controls></video>
                        <a href="${url}" download="${outFileName}" class="dl-link">ডাউনলোড শর্টস ${i+1}</a>
                    `;
                    document.getElementById('result').appendChild(div);
                }

                updateStatus("✅ অভিনন্দন! এডিটিং সফল হয়েছে।");
                btn.disabled = false;
            };
        } catch (err) {
            updateStatus("❌ এরর: " + err.message);
            console.error(err);
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
